<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save to nodeck</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <header class="bar">
    <img src="../icons/icon-32.png" alt="" width="18" height="18">
    <h1>Save to nodeck</h1>
    <span class="server" id="page" title="This tab"></span>
    <a class="gear" id="settings" href="options.html" target="_blank" title="Settings" aria-label="Settings">⚙</a>
  </header>

  <p class="notice" id="loading">Reading the page…</p>
  <p class="notice warn" id="warning" hidden></p>

  <main class="pop" id="main" hidden>
    <section class="form">
      <fieldset class="field">
        <legend>Save as</legend>
        <div class="segmented compact">
          <label><input type="radio" name="mode" value="cards" checked> Cards</label>
          <label><input type="radio" name="mode" value="comic"> Comic</label>
          <label><input type="radio" name="mode" value="set"> Set</label>
        </div>
        <small id="modeHint"></small>
      </fieldset>
      <label class="field">
        <span>Title</span>
        <input id="title" type="text" maxlength="200" autocomplete="off">
      </label>
      <div class="field">
        <span>Tags <small id="tagCount"></small></span>
        <div class="chips" id="tags"></div>
        <input id="tagInput" type="text" placeholder="Add tag, Enter (artist:name…)" autocomplete="off">
      </div>
      <label class="field">
        <span>Source</span>
        <input id="sourceName" type="text" maxlength="255" placeholder="Site name" autocomplete="off">
      </label>
      <label class="field">
        <span>Source URL</span>
        <input id="sourceUrl" type="url" maxlength="2048" placeholder="https://…" autocomplete="off">
      </label>
      <button class="primary" id="save" type="button" disabled>Save</button>
      <div class="progress" id="progress" hidden><div id="progressBar"></div></div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="media">
      <div class="media-bar">
        <span id="count"></span>
        <button type="button" id="all">All</button>
        <button type="button" id="none">None</button>
        <button type="button" id="reverse" title="Reverse the order">Reverse</button>
        <button type="button" id="rescan" title="Read the page again (all images and videos)">All on page</button>
      </div>
      <ol class="tiles" id="tiles"></ol>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
