<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save to nodeck</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header class="bar">
    <img src="../icons/icon-32.png" alt="" width="20" height="20">
    <h1 id="heading">Save to nodeck</h1>
    <span class="server" id="server" title="nodeck server"></span>
  </header>

  <main id="main" class="layout">
    <p class="notice warn" id="warning" hidden></p>

    <section class="form" id="form">
      <div class="preview" id="preview" hidden></div>

      <label class="field">
        <span>Title</span>
        <input id="title" type="text" maxlength="200" autocomplete="off">
      </label>

      <fieldset class="field" id="kindField" hidden>
        <legend>Save as</legend>
        <div class="segmented">
          <label><input type="radio" name="kind" value="comic" checked> Comic <small>pages in order</small></label>
          <label><input type="radio" name="kind" value="set"> Set <small>a group of images</small></label>
          <label><input type="radio" name="kind" value="cards"> Cards <small>each file its own card</small></label>
        </div>
      </fieldset>

      <div class="field">
        <span>Tags <small id="tagCount"></small></span>
        <div class="chips" id="tags"></div>
        <input id="tagInput" type="text" placeholder="Add a tag and press Enter (artist:name, character:name…)" autocomplete="off">
      </div>

      <div class="field two">
        <label>
          <span>Source</span>
          <input id="sourceName" type="text" maxlength="255" placeholder="Site name" autocomplete="off">
        </label>
        <label>
          <span>Source URL</span>
          <input id="sourceUrl" type="url" maxlength="2048" placeholder="https://…" autocomplete="off">
        </label>
      </div>

      <div class="progress" id="progress" hidden><div id="progressBar"></div></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button class="primary" id="save" type="button" disabled>Save</button>
        <button id="cancel" type="button">Close</button>
      </div>
    </section>

    <section class="pages" id="pagesSection" hidden>
      <div class="pages-bar">
        <h2 id="pagesHeading">Pages</h2>
        <div class="tools">
          <button type="button" id="reverse" title="Reverse the page order">Reverse order</button>
          <button type="button" id="removeSmall" title="Remove images smaller than 300 px on the short side">Remove small</button>
        </div>
      </div>
      <p class="hint">Drag pages to reorder them, or use the arrows. × removes a page. To save just one picture, remove the others and choose Cards.</p>
      <ol class="grid" id="grid"></ol>
      <details class="removed" id="removedBox" hidden>
        <summary id="removedHeading">Removed</summary>
        <ul class="grid small" id="removed"></ul>
      </details>
    </section>
  </main>

  <script type="module" src="review.js"></script>
</body>
</html>
