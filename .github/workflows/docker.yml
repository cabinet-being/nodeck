name: Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cabinet-being/nodeck

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.zima.yml config -q
          cp .env.example .env
          sed -i 's/change-me/ci-placeholder/' .env
          docker compose -f docker-compose.yml config -q

      - name: Version and tags
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" == "$(tr -d '[:space:]' < VERSION)" ]] || {
              echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)" >&2; exit 1; }
            # Releases move "latest", which the ZimaOS compose file uses.
            tags="$IMAGE:$version,$IMAGE:latest"
          else
            version="$(tr -d '[:space:]' < VERSION)-main.${GITHUB_SHA::7}"
            tags="$IMAGE:main,$IMAGE:sha-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: NODECK_VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
